<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="920" height="620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect width="920" height="620" fill="#ffffff"/>
  <text x="32" y="40" font-size="21" font-weight="700" fill="#111827">nofault v0.4.0 · 代码生成流水线</text>
  <text x="32" y="62" font-size="12.5" fill="#6b7280">契约（两种写法）→ 同一个 Spec → 校验 → 生成 → 落盘；生成物是普通 TypeScript，不进请求链路</text>

  <!-- 输入 -->
  <rect x="32" y="96" width="188" height="62" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="126" y="122" font-size="13.5" font-weight="600" fill="#3730a3" text-anchor="middle">.api.ts（主推）</text>
  <text x="126" y="142" font-size="11.5" fill="#4b5563" text-anchor="middle">TS 类 + 装饰器，IDE 原生支持</text>

  <rect x="32" y="170" width="188" height="62" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="126" y="196" font-size="13.5" font-weight="600" fill="#3730a3" text-anchor="middle">.api（文本 DSL）</text>
  <text x="126" y="216" font-size="11.5" fill="#4b5563" text-anchor="middle">手写扫描器，不用 ANTLR</text>

  <!-- parser -->
  <rect x="286" y="118" width="150" height="92" rx="9" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
  <text x="361" y="146" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle">@nofault/parser</text>
  <text x="361" y="168" font-size="11.5" fill="#4b5563" text-anchor="middle">Scanner（词法）</text>
  <text x="361" y="185" font-size="11.5" fill="#4b5563" text-anchor="middle">递归下降（语法）</text>
  <text x="361" y="202" font-size="11.5" fill="#4b5563" text-anchor="middle">错误带行列号</text>

  <line x1="222" y1="127" x2="282" y2="150" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="222" y1="201" x2="282" y2="180" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- spec -->
  <rect x="504" y="118" width="150" height="92" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="579" y="146" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">ApiSpec</text>
  <text x="579" y="168" font-size="11.5" fill="#4b5563" text-anchor="middle">types / services</text>
  <text x="579" y="185" font-size="11.5" fill="#4b5563" text-anchor="middle">routes / fields</text>
  <text x="579" y="202" font-size="11.5" fill="#4b5563" text-anchor="middle">唯一枢纽</text>

  <line x1="438" y1="164" x2="500" y2="164" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- validate -->
  <rect x="722" y="118" width="166" height="92" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="805" y="146" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle">validateSpec</text>
  <text x="805" y="168" font-size="11.5" fill="#4b5563" text-anchor="middle">重复路由 / 未知类型</text>
  <text x="805" y="185" font-size="11.5" fill="#4b5563" text-anchor="middle">路径缺斜杠 / 属性重名</text>
  <text x="805" y="202" font-size="11.5" fill="#4b5563" text-anchor="middle">一次报完，先拦后生成</text>
