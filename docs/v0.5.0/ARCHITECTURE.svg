<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="32" y="38" font-size="21" font-weight="700" fill="#111827">nofault v0.5.0 · 数据访问层</text>
  <text x="32" y="60" font-size="12.5" fill="#6b7280">方言只生成字符串、Repository 不碰 SQL；数据源是唯一的 IO 边界，因此可换成任何数据库</text>

  <rect x="32" y="92" width="200" height="70" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="132" y="118" font-size="13.5" font-weight="600" fill="#3730a3" text-anchor="middle">实体映射装饰器</text>
  <text x="132" y="138" font-size="11.5" fill="#4b5563" text-anchor="middle">@Entity @Column @PrimaryGeneratedColumn</text>
  <text x="132" y="153" font-size="11.5" fill="#4b5563" text-anchor="middle">列名默认 snake_case，类型由 design:type 推断</text>

  <rect x="286" y="92" width="180" height="70" rx="9" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
  <text x="376" y="118" font-size="13.5" font-weight="600" fill="#0f766e" text-anchor="middle">Repository / QueryBuilder</text>
  <text x="376" y="138" font-size="11.5" fill="#4b5563" text-anchor="middle">save / find / paginate</text>
  <text x="376" y="153" font-size="11.5" fill="#4b5563" text-anchor="middle">where 分组、排序、分页</text>

  <line x1="234" y1="127" x2="282" y2="127" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="520" y="92" width="160" height="70" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="600" y="118" font-size="13.5" font-weight="600" fill="#92400e" text-anchor="middle">Dialect（纯字符串）</text>
  <text x="600" y="138" font-size="11.5" fill="#4b5563" text-anchor="middle">createTable / insert / select</text>
  <text x="600" y="153" font-size="11.5" fill="#4b5563" text-anchor="middle">不碰 IO，可单测</text>

  <line x1="468" y1="127" x2="516" y2="127" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="734" y="92" width="134" height="70" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>